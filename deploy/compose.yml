# Runs on hermes-agent-01: one app process (the spend ledger needs a single owner) behind Caddy for TLS.
# Caddy binds the public IPv4 only, because tailscaled already holds port 80 on the tailnet address.
services:
  app:
    build: ..
    env_file: .env
    environment:
      EVENT_BUDGET_MICROS: "6000000"
    volumes:
      - billproof-data:/data
    mem_limit: 512m
    cpus: "1.5"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "87.99.154.94:80:80"
      - "87.99.154.94:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"

volumes:
  billproof-data:
  caddy-data:
  caddy-config:
